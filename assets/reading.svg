<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="610" viewBox="0 0 1800 610" role="img" aria-labelledby="title desc">
<title id="title">Read. Inspect. Connect.</title>
<desc id="desc">Read the story, inspect its supporting sources, and keep related stories together.</desc>
<defs>
  <linearGradient id="night" x2="1" y2="1"><stop stop-color="#15110f"/><stop offset=".55" stop-color="#090a0b"/><stop offset="1" stop-color="#120d09"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#5b2614" stop-opacity="0"/><stop offset=".32" stop-color="#ff6b15"/><stop offset=".70" stop-color="#ffcb81"/><stop offset="1" stop-color="#5b2614" stop-opacity="0"/></linearGradient>
  <radialGradient id="atmosphere"><stop stop-color="#c7460c" stop-opacity=".16"/><stop offset="1" stop-color="#c7460c" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="1800" height="610" rx="108"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1800" height="610" fill="url(#night)"/>
  <ellipse cx="900" cy="730" rx="1050" ry="550" fill="url(#atmosphere)"/>
  <path d="M-70 595 Q900 250 1870 595" fill="none" stroke="#ffc58d" stroke-opacity=".09"/>
  <path d="M-70 650 Q900 305 1870 650" fill="none" stroke="#ffc58d" stroke-opacity=".05"/>
  <text x="92" y="98" fill="#d69e77" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="5">THE READING EXPERIENCE</text>
  <path d="M92 160 H1708" stroke="url(#beam)" stroke-width="1.5"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(92 0)">
      <text y="244" fill="#f38a45" font-size="23" letter-spacing="3">01</text>
      <text y="340" fill="#fff3e3" font-size="76" font-weight="600" letter-spacing="-3">Read.</text>
      <text y="407" fill="#bcb3a9" font-size="32">Open the story.</text>
      <text y="455" fill="#bcb3a9" font-size="32">Take in the details.</text>
    </g>
    <g transform="translate(667 0)">
      <text y="244" fill="#f38a45" font-size="23" letter-spacing="3">02</text>
      <text y="340" fill="#fff3e3" font-size="76" font-weight="600" letter-spacing="-3">Inspect.</text>
      <text y="407" fill="#bcb3a9" font-size="32">See the checked claims.</text>
      <text y="455" fill="#bcb3a9" font-size="32">Open the supporting sources.</text>
    </g>
    <g transform="translate(1242 0)">
      <text y="244" fill="#f38a45" font-size="23" letter-spacing="3">03</text>
      <text y="340" fill="#fff3e3" font-size="76" font-weight="600" letter-spacing="-3">Connect.</text>
      <text y="407" fill="#bcb3a9" font-size="32">Save what matters.</text>
      <text y="455" fill="#bcb3a9" font-size="32">Explore related stories.</text>
    </g>
  </g>
  <path d="M610 234V466 M1185 234V466" stroke="#fff1df" stroke-opacity=".10"/>
  <circle cx="92" cy="160" r="4" fill="#ffb576"/>
  <circle cx="667" cy="160" r="4" fill="#ffb576"/>
  <circle cx="1242" cy="160" r="4" fill="#ffb576"/>
</g></svg>
